name: expense-demo

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: /expense-tracker-demo/
        VITE_DEMO_MODE: "true"
    image: expense-tracker-demo-frontend:latest
    restart: unless-stopped
    mem_limit: 128m
    expose:
      - "80"
    volumes:
      - ./frontend/public/demo:/usr/share/nginx/html/demo:ro
