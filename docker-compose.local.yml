# Override lokal untuk development: backend JVM (cepat) menggantikan image native.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: expense-tracker-backend-jvm:latest
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
