services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: expense_tracker
      MYSQL_USER: expense
      MYSQL_PASSWORD: expense-pass
      MYSQL_ROOT_PASSWORD: root-pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uexpense -pexpense-pass --silent && mysql -h localhost -uexpense -pexpense-pass -e 'SELECT 1' expense_tracker",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  backend:
    image: ${BACKEND_IMAGE:-expense-tracker-backend-jvm:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "8080:8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_URL: jdbc:mysql://mysql:3306/expense_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: expense
      DB_PASSWORD: expense-pass
      UPLOAD_DIR: /app/uploads
      NOTIFIER_URL: http://notifier:8081
      TZ: Asia/Jakarta
      ACCESS_CODE: ${ACCESS_CODE:-123456}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  notifier:
    build:
      context: ./notifier
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 8081
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
