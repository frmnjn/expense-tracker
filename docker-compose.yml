services:
  backend:
    image: expense-tracker-backend-native:latest
    mem_limit: 128m
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "3000:80"
    depends_on:
      - backend
