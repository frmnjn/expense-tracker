server:
  port: ${PORT:8080}

spring:
  application:
    name: expense-tracker-backend
  config:
    import: optional:file:./.env
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

upload:
  dir: ${UPLOAD_DIR:/app/uploads}

access:
  code: ${ACCESS_CODE:}

ai:
  gemini-api-key: ${GEMINI_API_KEY:}
  model: ${AI_MODEL:gemini-3.5-flash-lite}
  timeout: ${AI_TIMEOUT:600}
  max-attempts: ${AI_MAX_ATTEMPTS:50}
  retry-delay-ms: ${AI_RETRY_DELAY_MS:2000}
  fx-api: ${AI_FX_API:https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@%DATE%/v1/currencies/%CUR%.json}
  fx-timeout-ms: ${AI_FX_TIMEOUT_MS:8000}

notify:
  notifier-url: ${NOTIFIER_URL:}
  emails: ${NOTIFY_EMAILS:}
  test-mode: ${NOTIFY_TEST_MODE:false}
  test-email: ${NOTIFY_TEST_EMAIL:}

inbox:
  enabled: ${INBOX_ENABLED:false}
  host: ${INBOX_HOST:imap.gmail.com}
  port: ${INBOX_PORT:993}
  user: ${INBOX_USER:${SMTP_USER:}}
  app-password: ${INBOX_APP_PASSWORD:${SMTP_APP_PASSWORD:}}
  folder: ${INBOX_FOLDER:INBOX}
  poll-ms: ${INBOX_POLL_MS:300000}
  senders: ${INBOX_SENDERS:klikbca.com,bca.co.id,danamon.co.id}
  lookback-days: ${INBOX_LOOKBACK_DAYS:3}
  max-per-poll: ${INBOX_MAX_PER_POLL:50}
  discard-merchants: ${INBOX_DISCARD_MERCHANTS:}

flyway:
  locations: ${FLYWAY_LOCATIONS:filesystem:/app/db/migration}

logging:
  structured:
    format:
      console: ecs
