server:
  port: ${PORT:8080}

spring:
  application:
    name: expense-tracker-backend
  config:
    import: optional:file:./.env
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

upload:
  dir: ${UPLOAD_DIR:/app/uploads}

access:
  code: ${ACCESS_CODE:}

ai:
  gemini-api-key: ${GEMINI_API_KEY:}
  model: ${AI_MODEL:gemini-3.5-flash-lite}
  timeout: ${AI_TIMEOUT:600}
  max-attempts: ${AI_MAX_ATTEMPTS:50}
  retry-delay-ms: ${AI_RETRY_DELAY_MS:2000}
  fx-api: ${AI_FX_API:https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@%DATE%/v1/currencies/%CUR%.json}
  fx-timeout-ms: ${AI_FX_TIMEOUT_MS:8000}

notify:
  notifier-url: ${NOTIFIER_URL:}
  emails: ${NOTIFY_EMAILS:}
  test-mode: ${NOTIFY_TEST_MODE:false}
  test-email: ${NOTIFY_TEST_EMAIL:}

flyway:
  locations: ${FLYWAY_LOCATIONS:filesystem:/app/db/migration}

logging:
  structured:
    format:
      console: ecs
