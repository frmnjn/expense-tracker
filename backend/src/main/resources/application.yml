server:
  port: ${PORT:8080}

spring:
  application:
    name: expense-tracker-backend
  config:
    import: optional:file:./.env
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

upload:
  dir: ${UPLOAD_DIR:/app/uploads}

flyway:
  locations: ${FLYWAY_LOCATIONS:filesystem:/app/db/migration}

logging:
  structured:
    format:
      console: ecs
