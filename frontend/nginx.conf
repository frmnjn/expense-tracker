server {
    listen 80;
    server_name _;

    # Docker embedded DNS supaya hostname "backend" di-resolve per-request
    # (mencegah 502 saat container backend di-recreate & IP-nya berubah).
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Batas ukuran request (upload foto invoice). Backend allow 10MB file / 12MB request.
    client_max_body_size 15M;

    location /api/ {
        set $upstream_backend http://backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html & service worker tidak boleh di-cache agar update langsung
    # kebaca (asset ber-hash tetap aman di-cache lama).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
