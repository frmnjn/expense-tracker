services:
  backend:
    image: expense-tracker-backend-jvm:latest
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Jakarta
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
