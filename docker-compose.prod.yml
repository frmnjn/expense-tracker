services:
  backend:
    image: expense-tracker-backend-native:latest
    restart: unless-stopped
    mem_limit: 128m
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/credentials.json:/app/credentials.json:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "23824:80"
    depends_on:
      - backend
