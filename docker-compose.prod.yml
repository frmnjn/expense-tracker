services:
  backend:
    image: expense-tracker-backend-native:latest
    restart: unless-stopped
    mem_limit: 128m
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "23824:80"
    depends_on:
      - backend

volumes:
  uploads:
