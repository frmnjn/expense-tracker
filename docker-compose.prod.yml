services:
  backend:
    image: expense-tracker-backend-native:latest
    restart: unless-stopped
    mem_limit: 192m
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NOTIFIER_URL: http://notifier:8081
    volumes:
      - ./uploads:/app/uploads

  notifier:
    build:
      context: ./notifier
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 8081

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "23824:80"
    depends_on:
      - backend
